name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    permissions:
      contents: read
    uses: okamyuji/reusable-workflows/.github/workflows/dotnet-ci.yml@b531424e1d17ba1f1ef6eb37f738882dc77b8c21 # v1
    with:
      godot-sha512: "1855960b27ee3ef5e66e5e228cced69d55637b24334a7411162687dcd077d8f9f645348cdb8eae984bec8135d49ed855a1e3a16476786b8bce60774fd8402d13"
      mutation-score-threshold: 60

  security:
    permissions:
      contents: read
      pull-requests: write
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@d760737e82c73894e10ba8490a719751e0dd3bc8 # v1
